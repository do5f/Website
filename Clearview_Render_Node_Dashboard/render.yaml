services:
  - type: web
    name: clearview-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clearview-db
          property: connectionString

databases:
  - name: clearview-db
    plan: free
    databaseName: clearview
    user: clearview_user
